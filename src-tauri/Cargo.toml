[package]
name = "downpilot"
version = "0.1.0"
description = "DownPilot - high-performance download manager for Linux (Tauri v2)"
edition = "2021"

[lib]
name = "downpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
downpilot-core = { path = "crates/downpilot-core" }

[workspace]
members = ["crates/downpilot-core", "crates/downpilot-nmh"]
resolver = "2"
