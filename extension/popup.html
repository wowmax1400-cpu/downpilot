<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 260px; padding: 12px; font-family: Inter, system-ui, sans-serif;
        font-size: 13px; background: #0a0a0c; color: #e8e8ec;
      }
      .logo { font-weight: 700; font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
      .logo span { color: #7c5cff; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 10px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.on { background: #34d399; }
      .dot.off { background: #f87171; }
      label { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 10px; cursor: pointer; }
      btn {
        display: block; width: 100%; padding: 8px; border: none; border-radius: 6px;
        background: #7c5cff; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
        text-align: center; text-decoration: none;
      }
      btn:hover { background: #6a4ce0; }
      .footer { margin-top: 8px; font-size: 10px; color: #6b6b76; text-align: center; }
    </style>
  </head>
  <body>
    <div class="logo"><span>⬇</span> DownPilot</div>
    <div class="status">
      <span class="dot off" id="dot"></span>
      <span id="statusText">Not connected</span>
    </div>
    <label>
      <input type="checkbox" id="autoIntercept" />
      Block Chrome downloads, use DownPilot
    </label>
    <a id="openBtn" href="#" style="display:block;width:100%;padding:8px;border:none;border-radius:6px;background:#7c5cff;color:#fff;font-size:12px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none">Open DownPilot</a>
    <div class="footer">v0.1.0</div>
    <script src="popup.js"></script>
  </body>
</html>
